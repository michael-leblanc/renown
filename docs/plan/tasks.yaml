# ---- Client wave (planned with Michael on 2026-11-15, D211 to D216) ----
# What it shows at the end (D211): a headless server and two game windows. Each
# player gets a character, clicks to walk and to use the door, sees the stand-in
# NPCs wander, and sees the other player only while in sight (D176, D179).
# Tested on desktop 1 (Linux) and Michael's Mac over the home network (D212).
# Nothing in this wave is critical (D213): the orchestrator merges every task
# after QA. The one UAT is NET-005, which Michael plays on the two machines.
# Not in this wave: saving, the land generator, combat, random birth (stats,
# backgrounds), names, a roof, a Windows start script.
#
# Prefixes: SIM- the server's plain-data world (game/sim/), NET- what goes over
# the network (game/net/, game/server/), CLI- the game window (game/client/).
# Folder rules for net/ and client/ are in docs/architecture/layout.md: client/
# never names a class from sim/; it uses net/ and the tables in data/.
# "Wave" here means all 14 tasks below, run to the end.

- id: SIM-008
  title: Step movement, sight and the NPC brains from one step of the world
  repo: .
  status: done
  size: S
  critical: false
  depends_on: [SIM-007]
  touches:
    - game/sim/sim.gd
    - game/test/sim/test_sim.gd
    - game/tools/measure.gd
    - game/test/tools/test_measure.gd
  spec: [D4, D175, D180, D181, D183, docs/architecture/layout.md]
  acceptance:
    - Given a world with one character ordered to walk 5 tiles east, when the world is stepped 15 times with step() alone, then the character stands on that tile
    - Given a world with 100 NPCs attached to the brain, when it is stepped 10 times with step() alone, then every NPC has thought exactly once
    - Given one step, when it runs, then the brains think first, the walks advance next and the tick number goes up last, the order the measurement used
    - Given the measurement at 32 NPCs with its fixed seed, when it runs on the new step, then its state hash equals the hash it gave before this task, written into the test as a number
    - Given a world with no brain and no walk, when it is stepped 600 times, then it is at tick 600 and its state hash is the same as before this task
  notes: Today Sim.step() only raises the tick, and tools/measure.gd builds SimPathing, SimMovement, SimSight and SimNpcBrain itself and calls brain.step(), movement.step(), sim.step(). Move that wiring into Sim so the server and the tools run the same step. Record the measurement's hash at 32 NPCs before you change anything.
  uat: false

