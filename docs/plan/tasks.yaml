  repo: .
  status: pr_open
  size: S
  critical: false
  depends_on: []
  touches:
    - game/sim/world.gd
    - game/sim/stand_in_world.gd
    - game/server/net_server.gd
    - game/tools/measure.gd
    - game/test/sim/test_world.gd
    - game/test/server/test_net_server.gd
    - game/test/sim/test_doors.gd
    - game/test/sim/test_movement.gd
    - game/test/sim/test_npc_brain.gd
