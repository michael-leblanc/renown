- id: NET-001
  title: Work out what one character is sent, the land once and then each tick who and which doors it has in sight
  repo: .
  status: done
  size: M
  critical: false
  depends_on: [SIM-010, SIM-011]
  touches:
    - game/net/messages.gd
    - game/server/view.gd
    - game/sim/movement.gd
    - game/test/net/test_messages.gd
    - game/test/server/test_view.gd
  spec: [D4, D175, D176, D179, D190, D191, D214, D215, docs/architecture/layout.md]
  acceptance:
    - Given a character on the stand-in world, when its welcome is built, then it holds a protocol version, the character's own id, the tick rate, the walk time per tile, the map's size, the ground kind and prop of every tile, and every edge that is a wall or a door
    - Given two characters 5 tiles apart on open ground, when the view of one is built, then it lists both, each with its id, its tile, the tile it is stepping onto or none, its race and its worn parts with their colours
    - Given a character with a sight-blocking edge or tile between it and the viewer, or 17 tiles away, when the view is built, then that character is not in it
    - Given a viewer, when its view is built, then the viewer itself is always in it
    - Given one door in sight and one out of sight, when the view is built, then it says open or closed for the first and nothing about the second
    - Given any welcome, view, order or refusal, when it is read, then every key is in the list in game/net/messages.gd and every value is a number, a string, an array or a dictionary, never an object
    - Given a welcome and a view, when each is turned to bytes with var_to_bytes and back, then it equals the original
    - Given 32 NPCs and 2 player characters, when both views are built in the same tick, then sight was rebuilt once, counted by the test
    - Given game/net/messages.gd, when it is read, then it names the shapes of all five messages (hello, welcome, view, order to walk or to use a door, refusal with a reason) and no class from game/sim/
  notes: game/net/ is shared by the server and the client, so it holds only plain shapes and names. Building a view reads the world, so it lives in game/server/view.gd. Nothing else about a character is ever sent - no brain, no walk target, no other character's order. Add the small read-only accessor movement needs to say which tile a character is stepping onto. The stand-in land is sent whole at the welcome (D215); sending land by area waits for the generator and the map (D146).
  uat: false

- id: NET-002
  title: Accept clients over ENet and give each one a character at the waking spot
  repo: .
  status: done
  size: L
  critical: false
  depends_on: [NET-001]
  touches:
    - game/net/link.gd
    - game/server/net_server.gd
    - game/server/server_main.gd
    - game/data/settings.json
    - game/test/server/test_net_server.gd
    - game/test/helpers
  spec: [D1, D4, D173, D175, D176, D215, D216, CLAUDE.md, docs/architecture/layout.md]
  acceptance:
    - Given the server started with --port=24600, when it starts, then it listens on that port and prints it, and with no --port it uses the port in the settings
    - Given a client that connects and sends a hello with a player id, when the server answers, then a new character with a rolled look stands on the free tile nearest the waking spot and that client receives its welcome
    - Given a connected client, when a tick runs, then it receives one view built for its own character and never another client's view
    - Given two clients with different player ids, when both are welcomed, then each has its own character on its own tile
    - Given a hello with a player id that is already connected, when it arrives, then it is refused with a reason and the first client is not disturbed
    - Given a hello with another protocol version, when it arrives, then it is refused with a reason that gives both versions
    - Given a client that connects and sends no hello within the hello timeout, when the time is up, then the server drops it
    - Given a port already in use, when the server starts, then it prints the error and exits 1
    - Given game/net/link.gd, when it is read, then it declares every message of game/net/messages.gd as an RPC (hello, welcome, view, order, refusal), so later tasks add no RPC
  notes: Godot's high-level multiplayer over ENetMultiplayerPeer (CLAUDE.md). One node at the same path on both sides carries the RPCs (game/net/link.gd); the server side hands an order to a handler that NET-003 fills in, and until then ignores it. Check the 4.7 docs for the multiplayer API before writing (godot-docs-lookup). Tests can run a server and clients in one process, each under its own multiplayer branch (SceneTree.set_multiplayer), on a loopback port picked by the test. Known issue in docs/decisions.md - verify.sh fails an expected engine error raised after an await; don't write a test that expects one. The port, the hello timeout and the protocol version are settings.
  uat: false

- id: NET-003
  title: Carry out a client's walk and door orders on its own character only
  repo: .
  status: done
  size: M
  critical: false
  depends_on: [NET-002]
  touches:
    - game/server/orders.gd
    - game/server/net_server.gd
    - game/data/settings.json
    - game/test/server/test_orders.gd
  spec: [D4, D16, D176, D187, D191, D215, docs/architecture/layout.md]
  acceptance:
    - Given a client's order to walk to a free tile, when ticks run, then its own character walks there by the same movement rule as any character
    - Given an order to walk to a blocked tile or to a tile it can't reach, when it is handled, then the character stays where it is and no path search ran
    - Given an order to use a door, when ticks run, then the client's character walks to the door and the door changes (SIM-011)
    - Given a new walk order while the character is walking, when it is handled, then the new one replaces the old one
    - Given an order message, when its shape is read, then it has no character id, so a client can only ever move its own character
    - Given an order with a tile outside the map, a missing field or a value of the wrong kind, when it arrives, then it is dropped, the server keeps running and the drop is counted
    - Given more orders in one second from one client than the limit in the settings, when they arrive, then the extra ones are dropped
    - Given an order from a connection that was never welcomed, when it arrives, then it is dropped
  notes: The server decides everything - the client sends what the player asked for and learns the result only from the views. No answer message is needed for a refused walk. The orders-per-second limit is a setting.
  uat: false

- id: NET-004
  title: Keep a leaver's character for 30 seconds and give it back when the player returns
  repo: .
  status: done
  size: M
  critical: false
  depends_on: [NET-003]
  touches:
    - game/server/players.gd
    - game/server/net_server.gd
    - game/data/settings.json
    - game/test/server/test_players.gd
  spec: [D4, D49, D182, D216, docs/architecture/layout.md]
  acceptance:
    - Given a welcomed client that disconnects, when 29 seconds of ticks run, then its character is still in the world, stopped on a free tile, and still in the views of characters that see it
    - Given the same player id back within those 30 seconds, when it says hello, then it gets the same character where it stands
    - Given 30 seconds of ticks after a disconnect, when the next tick runs, then the character is out of the world, its tile is free and it is in no view
    - Given the same player id back after its character left the world, when it says hello, then the same character (id and look) is back on the free tile nearest where it left
    - Given a client whose connection is lost without a goodbye, when the server notices, then it is treated the same as leaving
    - Given a server that is stopped and started again, when a known player id says hello, then it gets a new character on a new world
    - Given the linger time, when it is read, then it is a timing in the settings, in seconds (D175)
  notes: D49. There is no saving in this wave (D182), so players and their characters are kept only in the server's memory. A lingering character can be seen and walked through like any other; nothing can hurt anyone yet.
  uat: false

