# Task graph. Edit by hand or by the planning prompt; status changes go through:
#   node scripts/plan.mjs set <id> <status>
# "ready" and "blocked" are computed, never stored.
#
# Fields:
#   id          unique, prefix per area (OPS- tooling, SIM- the server's plain-data world)
#   title       one sentence, one reviewable claim, no "and"
#   repo        which repo the task changes (default "."; workspace add-on: app folder name)
#   status      todo | in_progress | review | needs_human | done
#   size        S | M | L  (weights for the critical path)
#   critical    true → reviewer runs, human merges (see "Critical" in CLAUDE.md)
#   depends_on  minimal edges only; plan.mjs warns about redundant ones
#   touches     files/folders the task may edit (used to detect parallel conflicts)
#   spec        decisions (Dxx) and docs the implementer reads
#   acceptance  Given / When / Then — each one becomes a test name
#   uat         true → ships docs/plan/uat/<id>.md for a human to test
#
# Wave 1 (planned with Michael on 2026-11-14): the Godot project, the plain-data
# world with its tick loop, and the NPC measurement on his two PCs.
# Nothing in this wave is critical: the orchestrator merges every task after QA.
# The one UAT is SIM-007, which Michael runs himself on both PCs.
# Not in this wave: the client, combat, saving, the land generator, networking.
#
# "Wave 1" here means all 9 tasks below, run to the end, then tag wave-1-done.
# The "wave: <n>" that `plan.mjs show` prints is only a task's depth in the graph
# (OPS-001 is 0, SIM-007 is 6). It is not a stopping point.

# ---- Wave 1, part 1: the tooling every other task relies on ----
- id: OPS-001
  title: Add the Godot project in game/ with GUT, checked by scripts/verify.sh
  repo: .
  status: todo
  size: M
  critical: false
  depends_on: []
  touches:
    - game/project.godot
    - game/addons/gut
    - game/test
    - game/.gutconfig.json
    - scripts/godot.sh
    - scripts/verify.sh
    - scripts/README.md
    - CLAUDE.md
    - .gitignore
  spec: [CLAUDE.md, D1, docs/architecture/layout.md]
  acceptance:
    - Given a PC with no Godot installed, when scripts/godot.sh --version runs, then it downloads Godot 4.7.2-stable once into the per-user cache and prints a version starting with 4.7.2
    - Given Godot already in the cache, when scripts/godot.sh runs in a second worktree, then nothing is downloaded again
    - Given a clean checkout, when scripts/verify.sh runs, then it prints PASS and exits 0
    - Given a failing GUT test, when scripts/verify.sh runs, then it prints FAIL with that test's file, its name and the line of the failed assert, and exits 1
    - Given a GDScript file with a parse error under game/ that no test loads, when scripts/verify.sh runs, then it prints FAIL with that file and exits 1
    - Given the finished task, when CLAUDE.md is read, then its Run line gives the command that opens the project in the pinned editor
  uat: false

- id: OPS-002
  title: Prove the verify-on-stop hook blocks a failing implementer
  repo: .
  status: todo
  size: S
  critical: false
  depends_on: [OPS-001]
  touches:
    - .claude/hooks/verify-on-stop.sh
    - .claude/settings.json
  spec: [CLAUDE.md]
  acceptance:
    - Given an implementer whose worktree fails verify.sh, when it tries to stop, then the hook blocks with the failures
    - Given any other agent, when it stops, then the hook exits 0
  uat: false

# ---- Wave 1, part 2: the server's plain-data world ----
- id: SIM-001
  title: Load settings from data, with timings in seconds turned into ticks
  repo: .
  status: todo
  size: S
  critical: false
  depends_on: [OPS-002]
  touches:
    - game/sim/settings.gd
    - game/data/settings.json
    - game/test/sim/test_settings.gd
  spec: [D175, docs/architecture/layout.md]
  acceptance:
    - Given a tick rate of 10 and a timing of 2 seconds, when the settings load, then that timing is 20 ticks
    - Given a tick rate of 20 and the same data, when the settings load, then that timing is 40 ticks
    - Given a timing that is not a whole number of ticks, when the settings load, then it is rounded to the nearest tick and never below 1
    - Given a setting that is not in the data, when code asks for it, then it fails with the setting's name instead of using a silent default
  uat: false

- id: SIM-002
  title: Hold the world as plain data, a tile grid with characters on it
  repo: .
  status: todo
  size: M
  critical: false
  depends_on: [OPS-002]
  touches:
    - game/sim/world.gd
    - game/sim/character.gd
    - game/test/sim/test_world.gd
  spec: [D4, D52, D180, D188, docs/architecture/layout.md]
  acceptance:
    - Given a new world of 64 by 48 tiles, when one tile is set as blocked, then only that tile reads as blocked
    - Given a tile set to block walking only, when it is read, then it blocks walking and not sight; and a tile set to block sight only blocks sight and not walking
    - Given a new tile, when it is read, then it holds a ground kind and no place, and setting a place id on it changes nothing else
    - Given a character added on a free tile, when the world is asked who stands there, then it answers with that character's id
    - Given a character removed from the world, when the world is asked about its tile, then the tile is free
    - Given a blocked tile or a tile outside the grid, when a character is added there, then the world refuses
    - Given a tile where a character already stands, when a second character is placed at rest there, then the world refuses
    - Given every script under game/sim/, when the test reads them, then none extends Node or uses the scene tree
  uat: false

- id: SIM-003
  title: Step the world in fixed ticks, by the clock or by hand
  repo: .
  status: todo
  size: M
  critical: false
  depends_on: [SIM-001, SIM-002]
  touches:
    - game/sim/sim.gd
    - game/server
    - game/test/sim/test_sim.gd
  spec: [D175, D180, D183, docs/architecture/layout.md]
  acceptance:
    - Given a world at tick 0, when it is stepped 600 times by hand, then it is at tick 600 without waiting for the clock
    - Given the clock-driven loop at 10 ticks a second, when 1 second passes, then exactly 10 ticks have run
    - Given one tick that takes longer than 0.1 seconds, when the loop goes on, then the late ticks run next and none is dropped
    - Given two worlds made from the same seed, when both are stepped 600 times, then their state hashes are equal
    - Given the headless server started with a tick limit of 50, when it reaches tick 50, then it prints the tick count and exits 0
  uat: false

- id: SIM-004
  title: Walk characters along a path on the grid in 8 directions
  repo: .
  status: todo
  size: M
  critical: false
  depends_on: [SIM-003]
  touches:
    - game/sim/movement.gd
    - game/sim/pathing.gd
    - game/data/settings.json
    - game/test/sim/test_movement.gd
  spec: [D18, D52, D180, D185, D187, docs/architecture/layout.md]
  acceptance:
    - Given a character sent to a tile 5 tiles east over open ground, when 15 ticks run, then it stands on that tile
    - Given a wall between a character and its target, when it walks there, then it goes around and never stands on a blocked tile
    - Given a diagonal step between two blocked tiles, when a path is worked out, then that step is not used
    - Given another character standing on the path, when a character walks it, then it passes through that tile without stopping on it
    - Given a target tile where another character stands at rest, when a character arrives, then it stops on the nearest free tile
    - Given a new map, when it is made, then every free tile carries the number of its connected area
    - Given a target inside a walled-off pocket, when a character is sent there, then it stays where it is, the order ends as "no path", and no path search ran, counted by the test
    - Given a blocked target tile, when a character is sent there, then the order ends as "no path" and no path search ran
  uat: false

- id: SIM-005
  title: Work out who a character has in sight, by distance with no wall between
  repo: .
  status: todo
  size: M
  critical: false
  depends_on: [SIM-001, SIM-002]
  touches:
    - game/sim/sight.gd
    - game/data/settings.json
    - game/test/sim/test_sight.gd
  spec: [D179, D184, D188, D190, docs/architecture/layout.md]
  acceptance:
    - Given two characters 5 tiles apart on open ground and a sight distance of 16, when sight is worked out, then each has the other in sight
    - Given two characters 17 tiles apart on open ground, when sight is worked out, then neither has the other in sight
    - Given a tile that blocks sight on the line between two characters 5 tiles apart, when sight is worked out, then neither has the other in sight
    - Given a tile that blocks walking but not sight on the line between two characters 5 tiles apart, when sight is worked out, then each has the other in sight
    - Given a character facing away from another one 5 tiles off, when sight is worked out, then it still has the other in sight
    - Given 1000 characters spread over a 512 by 512 map, when sight is worked out for one of them, then only characters in the nearby buckets are compared, counted by the test
  uat: false

- id: SIM-006
  title: Give NPCs a stand-in brain that thinks once a second, in turns
  repo: .
  status: todo
  size: M
  critical: false
  depends_on: [SIM-004, SIM-005]
  touches:
    - game/sim/npc_brain.gd
    - game/data/settings.json
    - game/test/sim/test_npc_brain.gd
  spec: [D4, D179, D181, docs/architecture/layout.md]
  acceptance:
    - Given 100 NPCs and a think interval of 1 second, when 10 ticks run, then every NPC has thought exactly once
    - Given 100 NPCs, when any single tick runs, then exactly 10 of them think in it
    - Given two possible actions with different scores, when an NPC thinks, then it does the one with the higher score
    - Given an NPC with nothing else to do, when it thinks, then it picks a free tile nearby, walks there, and keeps walking between two thoughts
    - Given an NPC that thinks, when the thought ends, then its list of characters in sight is fresh
    - Given a character with no brain attached, when ticks run, then nothing moves it
  uat: false

- id: SIM-007
  title: Measure the tick time for N NPCs on a headless server
  repo: .
  status: todo
  size: M
  critical: false
  depends_on: [SIM-006]
  touches:
    - game/tools/measure.gd
    - game/test/tools/test_measure.gd
    - scripts/measure.sh
    - scripts/README.md
    - docs/plan/uat/SIM-007.md
  spec: [D6, D178, D184, D186, docs/architecture/layout.md]
  acceptance:
    - Given scripts/measure.sh run with no arguments, when it ends, then it has printed one line for each of 32, 100, 250, 500, 1000, 2000, 4000 and 8000 NPCs with the average tick, the worst tick in milliseconds and the state hash
    - Given a finished run, when the last lines print, then they give the NPC budget (the largest count whose worst tick is under 20 ms, or "more than 8000") with the CPU name, the OS and the Godot version
    - Given the measurement's test map, when it is made, then it is 512 by 512 tiles with about 15% blocked in clumps of 3 to 9 tiles a side, not single scattered tiles
    - Given N NPCs, when they are placed, then a quarter start in each of two towns at one NPC per 100 tiles and half are spread over the map
    - Given the same seed, when the measurement runs twice with 32 NPCs, then the final state hash is the same both times
    - Given the option to measure a single count, when it is run with 32, then only that line prints
    - Given the UAT page, when Michael follows it, then it has the steps for desktop 1 (Linux, scripts/measure.sh) and for desktop 2 (Windows by hand, the Godot 4.7.2 Windows zip, the repo as a zip, one PowerShell command), says to run with nothing heavy going, and asks him to paste both outputs back
  uat: true
